# Intégration continue. Copier vers .github/workflows/ci.yml et committer.
#
# Tout ce qui peut échouer avant la production doit échouer ici. Les jobs
# tournent en parallèle pour qu'une erreur de style ne se cache pas derrière
# une suite de tests de cinq minutes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PHP_VERSION: '8.4'

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    # Correspond au moteur de production. Tester sur SQLite et livrer sur
    # MySQL revient à faire apparaître les différences en production plutôt qu'ici.
    services:
      database:
        image: mysql:8.0
        env:
          MYSQL_USER: app
          MYSQL_PASSWORD: app
          MYSQL_DATABASE: app_test
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -uapp -papp"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: mysql://app:app@127.0.0.1:3306/app_test?serverVersion=8.0&charset=utf8mb4

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ctype, iconv, intl, pdo_mysql
          coverage: none

      # L'isolation de la base de données vient de dama/doctrine-test-bundle, qui est
      # un require-dev. Ne jamais ajouter --no-dev ici : sans cela le bundle est absent,
      # l'extension PHPUnit ne trouve aucune connexion statique, et chaque test valide
      # (commit) — vert, et qui fuit. ramsey/composer-install installe les dépendances
      # de dev par défaut.
      - uses: ramsey/composer-install@v3

      # L'unique erreur de configuration qui ne s'annonce pas d'elle-même : l'extension
      # enregistrée dans phpunit.dist.xml alors que le bundle est absent de
      # config/bundles.php. La suite reste verte et l'isolation a simplement disparu.
      # Cette commande sort en 1 quand le bundle n'est pas activé dans l'environnement de test.
      - name: Check database isolation is actually enabled
        run: php bin/console --env=test debug:config dama_doctrine_test

      # Migrations, pas doctrine:schema:create. Une suite qui construit son schéma à
      # partir du mapping n'exerce jamais les migrations, et les migrations sont la
      # première chose que la production exécute — c'est ici qu'une migration cassée
      # doit échouer. Sur un projet sans migrations pour l'instant, `doctrine:schema:create`
      # est le remplaçant temporaire.
      #
      # Pas de `doctrine:fixtures:load` global non plus : les tests chargent les groupes
      # de fixtures dont ils ont besoin, à l'intérieur de la transaction que DAMA ouvre
      # pour eux (voir symfony-proglab-testing).
      - name: Prepare the test database
        run: php bin/console --env=test doctrine:migrations:migrate --no-interaction

      # phpunit.dist.xml porte failOnPhpunitNotice="true" et l'extension DAMA —
      # voir symfony-proglab-quality/assets/phpunit.dist.xml. Le fichier de la recette n'a ni l'un ni l'autre.
      - name: Run the test suite
        run: vendor/bin/phpunit

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ctype, iconv, intl
          coverage: none

      - uses: ramsey/composer-install@v3

      # L'extension Symfony résout les ids de service et les noms de route depuis
      # le conteneur compilé. Sauter cette étape et la moitié des règles se taisent
      # au lieu d'échouer, ce qui est pire qu'échouer.
      - name: Compile the container
        run: php bin/console cache:warmup --env=dev

      - name: PHPStan
        run: vendor/bin/phpstan analyse --configuration=phpstan.dist.neon --memory-limit=1G --no-progress

  code-style:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: php-cs-fixer
        run: vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.dist.php --dry-run --diff

  layers:
    name: Layer contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      # deptrac est à la demande : le job ne fait rien tant que deptrac.yaml n'est pas
      # commité, et composer-install échouerait sinon en résolvant un require-dev qui
      # n'a aucune raison d'être là pour l'instant.
      - uses: ramsey/composer-install@v3
        if: hashFiles('deptrac.yaml') != ''

      - name: deptrac
        if: hashFiles('deptrac.yaml') != ''
        run: vendor/bin/deptrac analyse --config-file=deptrac.yaml --report-uncovered --no-progress

  lint:
    name: Linters and audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ctype, iconv, intl
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: php bin/console lint:container
      - run: php bin/console lint:twig templates/
      - run: php bin/console lint:yaml config/
      - run: php bin/console doctrine:schema:validate --skip-sync

      - name: Known vulnerabilities (PHP)
        run: composer audit

      # Les dépendances JavaScript ont aussi des vulnérabilités. Sans npm dans
      # la boucle, rien d'autre ne les signale.
      - name: Known vulnerabilities (JavaScript)
        run: php bin/console importmap:audit
