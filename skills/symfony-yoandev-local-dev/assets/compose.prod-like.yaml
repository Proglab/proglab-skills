# Production-like check, run on demand — not the daily environment.
#
#   docker compose -f compose.yaml -f compose.prod-like.yaml up --build
#   open https://localhost
#
# Reuses the database from compose.yaml so you are testing against the same
# data. Note that compose.override.yaml is NOT loaded here, because -f is
# explicit: no exposed dev ports, no Mailpit unless you add it back.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod-like
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8
      # FrankenPHP issues its own certificate for localhost, which is what makes
      # HTTP/2 available — and HTTP/2 is a prerequisite for AssetMapper, not an
      # optimisation.
      SERVER_NAME: localhost
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
