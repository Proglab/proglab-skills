# Continuous integration. Copy to .github/workflows/ci.yml and commit it.
#
# Everything that can fail before production must fail here. The jobs run in
# parallel so a style error does not hide behind a five-minute test suite.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PHP_VERSION: '8.4'
  # Pinned: the moving `alpine` tag makes a green pipeline fail without a code change.
  PHPQA_IMAGE: jakzal/phpqa:1.125.1-php8.4-alpine

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    # Match the production engine. Testing on SQLite and shipping on
    # PostgreSQL means the differences surface in production instead of here.
    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U app"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app_test?serverVersion=16&charset=utf8

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ctype, iconv, intl, pdo_pgsql
          coverage: none

      # Database isolation comes from dama/doctrine-test-bundle, which is a
      # require-dev. Never add --no-dev here: without it the bundle is absent, the
      # PHPUnit extension finds no static connection, and every test commits — green,
      # and leaking. ramsey/composer-install installs dev dependencies by default.
      - uses: ramsey/composer-install@v3

      # The one configuration mistake that does not announce itself: the extension
      # registered in phpunit.dist.xml while the bundle is missing from
      # config/bundles.php. The suite stays green and the isolation is simply gone.
      # This command exits 1 when the bundle is not enabled in the test environment.
      - name: Check database isolation is actually enabled
        run: php bin/console --env=test debug:config dama_doctrine_test

      # Migrations, not doctrine:schema:create. A suite that builds its schema from
      # the mapping never exercises the migrations, and the migrations are the first
      # thing production runs — this is where a broken one must fail. On a project
      # with no migrations yet, `doctrine:schema:create` is the temporary stand-in.
      #
      # No global `doctrine:fixtures:load` either: tests load the fixture groups they
      # need, inside the transaction DAMA opens for them (see symfony-yoandev-testing).
      - name: Prepare the test database
        run: php bin/console --env=test doctrine:migrations:migrate --no-interaction

      # phpunit.dist.xml carries failOnPhpunitNotice="true" and the DAMA extension —
      # see symfony-yoandev-quality/assets/phpunit.dist.xml. The recipe's file has neither.
      - name: Run the test suite
        run: vendor/bin/phpunit

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ctype, iconv, intl
          coverage: none

      - uses: ramsey/composer-install@v3

      # The Symfony extension resolves service ids and route names from the
      # compiled container. Skip this and half the rules go quiet rather than
      # failing, which is worse than failing.
      - name: Compile the container
        run: php bin/console cache:warmup --env=dev

      - name: PHPStan
        uses: docker://jakzal/phpqa:1.125.1-php8.4-alpine
        with:
          args: phpstan analyse --configuration=phpstan.dist.neon --memory-limit=1G --no-progress

  code-style:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: php-cs-fixer
        uses: docker://jakzal/phpqa:1.125.1-php8.4-alpine
        with:
          args: php-cs-fixer fix --config=.php-cs-fixer.dist.php --dry-run --diff

  layers:
    name: Layer contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # deptrac is on demand: the job is a no-op until deptrac.yaml is committed.
      - name: deptrac
        if: hashFiles('deptrac.yaml') != ''
        uses: docker://jakzal/phpqa:1.125.1-php8.4-alpine
        with:
          args: deptrac analyse --config-file=deptrac.yaml --report-uncovered --no-progress

  lint:
    name: Linters and audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ctype, iconv, intl
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: php bin/console lint:container
      - run: php bin/console lint:twig templates/
      - run: php bin/console lint:yaml config/
      - run: php bin/console doctrine:schema:validate --skip-sync

      - name: Known vulnerabilities (PHP)
        run: composer audit

      # JavaScript dependencies have vulnerabilities too. With no npm in the
      # loop, nothing else reports them.
      - name: Known vulnerabilities (JavaScript)
        run: php bin/console importmap:audit
