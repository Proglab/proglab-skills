# The layer contract, made enforceable.
#
#   castor deptrac      (or: make deptrac)
#
# This is the mechanical version of the rule that matters most in this
# standard: a controller translates HTTP, a service holds the rule, a
# repository owns the queries. Reviewing that by hand works until the day
# someone is in a hurry.
#
# Adapt the directory names to the project — the boundaries are what matter,
# not the folder names.
#
# Two things to know before reading the ruleset:
#
# - A layer may only depend on the layers listed under it. Anything else that
#   is *also* a layer is a violation.
# - A dependency on a class that belongs to no layer (AbstractController,
#   LoggerInterface, a PHPUnit attribute, most of vendor/) is "uncovered".
#   deptrac ignores those unless asked; `--report-uncovered` lists them so a
#   src/ directory nobody collected is visible. `--fail-on-uncovered` is NOT
#   used: it would fail on the first vendor class a controller extends.
#
# Directories deliberately left out of the layers — src/Command, src/Doctrine,
# src/EventListener, src/Serializer, src/Health, src/Scheduler — are not
# analysed at all. Add a layer the day one of them needs a rule.
deptrac:
    paths:
        - ./src

    layers:
        - name: Controller
          collectors:
              - type: directory
                value: src/Controller/.*

        - name: Service
          collectors:
              - type: directory
                value: src/Service/.*

        - name: Repository
          collectors:
              - type: directory
                value: src/Repository/.*

        - name: Entity
          collectors:
              - type: directory
                value: src/Entity/.*

        - name: Dto
          collectors:
              - type: directory
                value: src/Dto/.*

        - name: Form
          collectors:
              - type: directory
                value: src/Form/.*

        - name: Message
          collectors:
              - type: directory
                value: src/(Message|MessageHandler)/.*

        # Business exceptions carry their own HTTP status (#[WithHttpStatus])
        # and are thrown by services, handlers and, rarely, controllers.
        - name: Exception
          collectors:
              - type: directory
                value: src/Exception/.*

        # Voters. A controller references their constants in #[IsGranted].
        - name: Security
          collectors:
              - type: directory
                value: src/Security/.*

        # Native enums, mapped with enumType: and used by forms and DTOs.
        - name: Enum
          collectors:
              - type: directory
                value: src/Enum/.*

        # Everything of Doctrine's *except* the two carve-outs below. The
        # negative lookahead is what keeps this file consistent with the layer
        # contract: the service owns the transaction boundary and calls
        # flush(), so it must be able to type-hint the entity manager — while
        # still being unable to touch QueryBuilder, DQL or DBAL.
        - name: Doctrine
          collectors:
              - type: classNameRegex
                value: '/^Doctrine\\(?!ORM\\EntityManagerInterface$|Persistence\\ObjectManager$|ORM\\Mapping\\|Common\\Collections\\|DBAL\\Types\\Types$).*/'

        # What an entity is made of: the #[ORM\...] mapping attributes, the
        # Collection classes, and DBAL's Types constants. Carved out so the
        # Entity layer can stay closed to everything else of Doctrine's.
        - name: DoctrineMapping
          collectors:
              - type: classNameRegex
                value: '/^Doctrine\\(ORM\\Mapping\\.*|Common\\Collections\\.*|DBAL\\Types\\Types)$/'

        # flush() only. Deliberately narrow: widening this to the whole
        # Doctrine layer would silently re-open queries in services, which is
        # the one rule this file exists to enforce.
        - name: EntityManager
          collectors:
              - type: classNameRegex
                value: '/^Doctrine\\(ORM\\EntityManagerInterface|Persistence\\ObjectManager)$/'

        - name: Http
          collectors:
              - type: classNameRegex
                value: '/^Symfony\\Component\\HttpFoundation\\.*/'

    ruleset:
        # A controller translates HTTP, so it sees HttpFoundation, and it may
        # reach the layers it translates between. Doctrine is deliberately
        # absent: no persistence in controllers. Entity is there for the
        # EntityValueResolver and for #[IsGranted(subject:)]; Security for
        # the voter constants those attributes name.
        Controller:
            - Http
            - Service
            - Dto
            - Entity
            - Form
            - Message
            - Exception
            - Security
            - Enum

        # A service holds the rule. It may ask a repository for data and it
        # calls flush() once per use case, but it may not build queries
        # (Doctrine) and it may not know about HTTP — note the absence of Http.
        Service:
            - Repository
            - Dto
            - Entity
            - Message
            - EntityManager
            - Exception
            - Enum

        # A repository is the only place allowed to touch Doctrine.
        Repository:
            - Entity
            - Dto
            - Doctrine
            - DoctrineMapping
            - EntityManager
            - Enum

        # Message handlers translate a message into a service call, exactly
        # like a controller translates a request. They reload from a
        # repository because a message carries identifiers, never entities.
        Message:
            - Service
            - Repository
            - Dto
            - Entity
            - Exception
            - Enum

        # Forms map onto input DTOs, never onto entities. An EnumType may
        # name an enum.
        Form:
            - Dto
            - Enum

        # Voters decide on an entity or a DTO. Nothing else of ours.
        Security:
            - Entity
            - Dto
            - Enum

        # An entity is mapping plus enums, nothing else of ours. Note what is
        # absent: a service or a repository, which would make it an
        # orchestrator. DTOs depend on nothing but the enums they carry;
        # enums and exceptions depend on nothing at all.
        Entity:
            - DoctrineMapping
            - Enum
        Dto:
            - Enum
        Enum: ~
        Exception: ~
