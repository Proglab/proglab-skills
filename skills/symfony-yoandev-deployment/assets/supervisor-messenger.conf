; Supervisor program for Messenger workers.
;
; Install as /etc/supervisor/conf.d/messenger-worker.conf, then:
;
;   supervisorctl reread
;   supervisorctl update
;   supervisorctl status
;
; ADAPT BEFORE USE:
;   command       path to php, path to the project, transport names in priority order
;   user          the user that owns var/ — never root
;   numprocs      how many concurrent consumers
;   environment   APP_ENV, and anything not already in .env.local.php

[program:messenger-worker]
command=/usr/local/bin/php /app/bin/console messenger:consume async --time-limit=3600 --memory-limit=128M
directory=/app
user=www-data

; environment= is the whole reason a worker "does not see" a variable that is
; set on the server: supervisord does not inherit the deploying user's shell.
; Anything the application needs and that .env.local.php does not carry must be
; listed here.
environment=APP_ENV="prod",APP_DEBUG="0"

; One program, N processes. process_name must include %(process_num)02d or they
; collide and only one survives.
numprocs=2
process_name=%(program_name)s_%(process_num)02d

autostart=true

; A worker that hits --time-limit or --memory-limit exits 0 on purpose.
; autorestart=true (not "unexpected") is what brings it back; "unexpected" would
; treat a clean exit as final and silently stop consuming.
autorestart=true
startsecs=1
startretries=10

; SIGTERM asks the worker to finish its current message and stop. stopwaitsecs
; must exceed the slowest handler, otherwise supervisor escalates to SIGKILL and
; the message is left in flight.
stopsignal=TERM
stopwaitsecs=120
stopasgroup=true
killasgroup=true

; Let the platform collect stdout/stderr rather than writing rotating files
; nobody watches. If supervisor must write files, set the paths here and ship
; them — an unread log is the same as no log.
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
