# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# Découverte des services des deux racines (AD-2, AD-13).
#
# Le glob des modules est écrit une fois pour la production, et une seconde fois sous
# `when@test` sur les modules de démonstration. Les deux sont volontairement l'un sous
# l'autre : c'est là qu'une divergence de forme se voit à l'œil nu.
parameters:
    # Le nom du dérivé — celui que le gabarit compose dans chaque `<title>`.
    #
    # Il vient de `APP_NAME` (voir `.env`) et s'arrête ici : le seul consommateur est le
    # global Twig `app_name` de `config/packages/twig.yaml`. Trois raisons pour une
    # variable d'environnement plutôt qu'un réglage administrable : un dérivé se renomme
    # au clonage sans éditer `src/` ni `config/`, le nom est déjà connu au premier rendu
    # (aucune requête en base pour afficher un titre), et une page d'erreur 500 le rend
    # encore quand la base ne répond plus.
    app.name: '%env(APP_NAME)%'

    # Le sel qui hache l'adresse IP et l'identifiant avant d'en faire une clé de cache,
    # pour le limiteur de connexion ci-dessous.
    #
    # `DefaultLoginRateLimiter` exige un secret **non vide** et refuse de se construire
    # sans. Le SecurityBundle lui passe `container.build_hash`, qui n'existe qu'à l'instant
    # où le conteneur est dumpé : ce n'est pas une entrée du sac de paramètres, donc
    # `%container.build_hash%` écrit en YAML échoue à la compilation — vérifié, message
    # « You have requested a non-existent parameter ». Seule une définition écrite en PHP
    # pourrait passer l'objet `Parameter` que le dumper sait lire, et ce dépôt configure en
    # YAML.
    #
    # `APP_SECRET` est donc le sel, avec un repli **parce qu'il est vide dans `.env`** et
    # n'a aucun chemin de production (entrée connue de `deferred-work.md`) : sans repli,
    # cette story transformerait ce trou silencieux en 500 sur chaque connexion. Le
    # processeur `default:` ne se replie que sur une valeur vide ou absente, donc dès
    # qu'`APP_SECRET` existe, c'est lui qui sert.
    #
    # Ce que le sel achète, et ce qu'il n'achète pas : le magasin du limiteur ne contient
    # aucune adresse email en clair. Il ne protège de rien d'autre — qui peut lire le pool
    # de cache peut déjà lire les sessions.
    app.login_throttling.fallback_secret: '%kernel.project_dir%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Un module se déclare en implémentant un contrat du socle : le tag est posé ici,
    # une fois, sur l'interface. `src/Core/Contract/` reste sans dépendance — pas même
    # un attribut de conteneur.
    _instanceof:
        App\Core\Contract\ModuleDescriptor:
            tags: ['app.module']

    # Le socle. La liste d'exclusion est celle des répertoires qui portent des données et
    # non des services : interfaces, DTO, entités et enums n'ont rien à faire dans le
    # conteneur.
    #
    # `Message` a rejoint la liste avec la story 1.8, après vérification par
    # `debug:container App\Core\Message\SendEmail` : sans lui, le message était bien
    # enregistré comme service. Un message est un objet de données, construit par son
    # appelant avec ses valeurs — un conteneur qui prétend savoir le fabriquer ne peut
    # qu'échouer à l'autowiring de ses scalaires. `MessageHandler`, lui, reste dans le
    # glob : un handler *est* un service, et c'est `#[AsMessageHandler]` qui le tague.
    App\Core\:
        resource: '../src/Core/'
        exclude: '../src/Core/{Contract,Dto,Entity,Enum,Message}'

    # Les modules du client. Ajouter un module ne modifie pas ce fichier.
    App\Module\:
        resource: '../src/Module/*/'
        exclude: '../src/Module/*/{Dto,Entity}'

    # Le limiteur du ralentissement de connexion (story 1.7).
    #
    # La classe est **celle de Symfony** : `login_throttling` la fabrique lui-même quand on
    # lui laisse ses valeurs par défaut, et tout ce que cette définition change, c'est de
    # quoi elle est faite. Les deux moitiés portent chacune un palier
    # (`config/packages/rate_limiter.yaml`) :
    #
    # - `$globalFactory` est indexé sur l'**adresse seule** — le palier long, vingt échecs
    #   par quart d'heure ;
    # - `$localFactory` sur le couple **identifiant + adresse** — le palier court, cinq
    #   échecs par minute.
    #
    # L'ordre des deux arguments est celui du constructeur natif, et il n'est pas
    # interchangeable : les inverser indexerait le palier long sur l'identifiant et
    # laisserait une machine essayer vingt comptes par minute depuis la même adresse.
    #
    # `$secret` est le sel de hachage des clés de cache ; voir le paramètre en tête de
    # fichier pour pourquoi ce n'est pas `container.build_hash`.
    Symfony\Component\Security\Http\RateLimiter\DefaultLoginRateLimiter:
        arguments:
            $globalFactory: '@limiter.login_address'
            $localFactory: '@limiter.login_attempt'
            $secret: '%env(default:app.login_throttling.fallback_secret:APP_SECRET)%'

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        # `_instanceof` ne vaut que pour les services définis dans le même bloc : le
        # miroir le reprend, comme il reprend `_defaults`.
        _instanceof:
            App\Core\Contract\ModuleDescriptor:
                tags: ['app.module']

        # Le hacheur de mots de passe, rendu atteignable depuis les tests.
        #
        # Aucun service du socle ne l'injecte encore — la commande d'initialisation de la
        # story 1.11 sera la première — donc le conteneur le supprime comme inutilisé, et
        # `tests/Core/Security/Accounts.php` ne peut plus créer de compte avec le hacheur
        # du projet. C'est la concession la plus étroite possible : l'alternative serait
        # de hacher dans le test avec un algorithme écrit en dur, c'est-à-dire de vérifier
        # la connexion sur un mécanisme que la production n'utilise pas.
        #
        # À retirer le jour où un service du socle l'injecte pour de bon.
        Symfony\Component\PasswordHasher\Hasher\UserPasswordHasherInterface:
            alias: security.user_password_hasher
            public: true

        # Le magasin du ralentissement de connexion, rendu effaçable depuis les tests.
        #
        # L'état du limiteur ne vit pas en base : il vit dans ce pool, un adaptateur de
        # fichiers sous `var/cache/test/`. DAMA n'a donc aucune prise dessus — il survit à
        # la méthode de test, à la classe, et à l'exécution entière. Sans remise à zéro
        # entre deux méthodes, les compteurs fuient et la suite devient dépendante de son
        # ordre ; pire, la fenêtre du palier long durant un quart d'heure, deux `make test`
        # lancés coup sur coup partageraient leurs compteurs.
        #
        # À retirer le jour où le magasin du limiteur cesse d'être un état global au
        # processus — un pool par noyau, par exemple.
        app.test.rate_limiter_pool:
            alias: cache.rate_limiter
            public: true

        # Le limiteur lui-même, rendu lisible depuis les tests.
        #
        # Deux lignes de la matrice de la story ne sont pas vérifiables sans lui : les
        # secondes attendues se lisent sur le limiteur et non dans le texte rendu, et
        # « après le délai » demande de vieillir la fenêtre — `FixedWindowLimiter` lit
        # l'heure par `microtime(true)`, donc aucune horloge simulée ne peut la décaler.
        #
        # À retirer le jour où un service du socle l'injecte pour de bon.
        app.test.login_rate_limiter:
            alias: Symfony\Component\Security\Http\RateLimiter\DefaultLoginRateLimiter
            public: true

        # Miroir du glob des modules ci-dessus, sur les modules de démonstration.
        App\Tests\Fixtures\Module\:
            resource: '../tests/Fixtures/Module/*/'
            exclude: '../tests/Fixtures/Module/*/{Dto,Entity}'

        # Le seul consommateur de `App\Core\Message\SendEmail` livré par la story 1.8.
        #
        # Il vit **hors** de
        # `tests/Fixtures/Module/` : le contrat de couches n'accorde à un module que
        # `App\Core\Contract\`, or ce cas d'usage référence un message du socle. Le mettre
        # dans le module de démonstration serait la violation `ModuleDemo on Core` que
        # `tests/Core/BoundaryTest.php` tient déjà — la classe explique le raisonnement en
        # entier, et `deferred-work.md` porte la question qu'il laisse ouverte.
        #
        # Il est déclaré **nommément**, et non par un glob sur le répertoire : le
        # `public: true` ci-dessous s'appliquerait sinon à toute classe qu'on y déposerait
        # ensuite. Les trois alias `when@test` ci-dessus se nomment un par un pour la même
        # raison, et chacun porte sa consigne de retrait.
        #
        # `public: true` parce que rien dans le socle ne l'injecte : le conteneur le
        # supprimerait comme inutilisé, et `tests/Core/Mail/EmailQueueTest.php` ne
        # pourrait plus l'atteindre.
        #
        # À retirer le jour où un cas d'usage réel du socle envoie un email : ce sera la
        # story 1.9, et ce chemin-là n'aura plus rien à prouver.
        App\Tests\Fixtures\Mail\DemoEmailDispatch:
            public: true
