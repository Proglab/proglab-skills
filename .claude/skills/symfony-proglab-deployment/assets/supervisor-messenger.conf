; Programme supervisor pour les workers Messenger.
;
; À installer comme /etc/supervisor/conf.d/messenger-worker.conf, puis :
;
;   supervisorctl reread
;   supervisorctl update
;   supervisorctl status
;
; À ADAPTER AVANT UTILISATION :
;   command       chemin vers php, chemin vers le projet (via le symlink `current`,
;                 pas une release spécifique — voir le commentaire de l'unité systemd
;                 pour comprendre pourquoi), noms des transports dans l'ordre de
;                 priorité
;   user          l'utilisateur qui possède var/ — jamais root
;   numprocs      le nombre de consommateurs concurrents
;   environment   APP_ENV, et tout ce qui n'est pas déjà dans .env.local.php

[program:messenger-worker]
command=/usr/bin/php /var/www/app/current/bin/console messenger:consume async --time-limit=3600 --memory-limit=128M
directory=/var/www/app/current
user=www-data

; environment= est toute la raison pour laquelle un worker "ne voit pas" une variable
; définie sur le serveur : supervisord n'hérite pas du shell de l'utilisateur qui
; déploie. Tout ce dont l'application a besoin et que .env.local.php ne porte pas doit
; être listé ici.
environment=APP_ENV="prod",APP_DEBUG="0"

; Un seul programme, N processus. process_name doit inclure %(process_num)02d, sinon
; ils entrent en collision et un seul survit.
numprocs=2
process_name=%(program_name)s_%(process_num)02d

autostart=true

; Un worker qui atteint --time-limit ou --memory-limit sort avec le code 0
; délibérément. autorestart=true (pas "unexpected") est ce qui le ramène ; "unexpected"
; traiterait une sortie propre comme définitive et arrêterait silencieusement la
; consommation.
autorestart=true
startsecs=1
startretries=10

; SIGTERM demande au worker de terminer son message en cours puis de s'arrêter.
; stopwaitsecs doit dépasser le handler le plus lent, sinon supervisor escalade vers
; SIGKILL et le message reste en plein traitement.
stopsignal=TERM
stopwaitsecs=120
stopasgroup=true
killasgroup=true

; Laisse la plateforme collecter stdout/stderr plutôt que d'écrire des fichiers
; tournants que personne ne surveille. Si supervisor doit écrire des fichiers, définis
; les chemins ici et livre-les — un log non lu équivaut à l'absence de log.
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
