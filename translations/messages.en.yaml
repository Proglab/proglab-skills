        submit: Send the link
        confirmation: "If an account exists for this address, a link has just been sent. It is valid for one hour."
        too_many: Too many requests from this device.
        back_to_login: Back to sign in
    reset:
        title: New password
        intro: "Choose a new password, then type it a second time."
        password: New password
        hint: "At least 16 characters. Three or four linked words make a good password."
        confirmation: Confirm the new password
        submit: Change my password
        done: "Password changed. Sign in with the new one."
